[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cerberus-guard-bot"
version = "0.1.0"
description = "Cerberus Guard Bot: a hardened, multi-agent shield for AI-to-AGI systems"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "IAmSoThirsty"}
]
keywords = ["AI", "AGI", "security", "guardian", "multi-agent"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "structlog>=24.0.0",
    "bcrypt>=4.0.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.0.0",
]

[project.scripts]
cerberus = "cerberus.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["N818", "N807"]

[tool.ruff.lint.per-file-ignores]
# Integrated sovereign spec bundles are machine-generated canonical data;
# line-length discipline does not apply to their long literal lines.
"src/core/integrated_specs/*.py" = ["E501"]
# Test files may exceed line length for readable assertion messages.
"tests/*.py" = ["E501"]
"tests/**/*.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true

# The shippable Cerberus security library is strictly type-checked.
# Machine-generated sovereign spec bundles (src/core/integrated_specs) are
# canonical data, not hand-maintained code, and are excluded from strict
# checking. The Thirsty-Lang 0.8.3 binding (utf.*) is an OPTIONAL dependency
# loaded lazily inside a try/except, so it is not required for type-checking,
# and defusedxml ships without stubs.
exclude = ["src/core/integrated_specs/"]

[[tool.mypy.overrides]]
module = ["utf.*", "defusedxml", "defusedxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=cerberus --cov-report=term-missing"
